[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-ken-runner"
version = "0.1.0"
description = "Remote YARF test runner agent for the Automated Ken snap-dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
automated-ken-runner = "automated_ken_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automated_ken_runner = ["resources/**/*"]
