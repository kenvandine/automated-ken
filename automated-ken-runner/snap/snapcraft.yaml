name: automated-ken-runner
base: core24
adopt-info: automated-ken-runner
title: Automate Ken Runner
summary: Remote YARF test execution agent for Automated Ken
description: |
  Install this on a dedicated test laptop with a real, logged-in desktop
  session. It enrolls with an ``automated-ken`` server, then polls for
  queued test jobs during idle time: installs/refreshes the snap under
  test, launches it in the real graphical session, drives it with YARF,
  extracts and uploads screenshots, and reports pass/fail back to the
  dashboard — no synthetic/headless compositor required.

  This snap uses **classic confinement** deliberately: running real YARF
  test suites requires installing and refreshing arbitrary third-party
  snaps (`snap install`/`snap refresh`), launching arbitrary GUI
  applications in the live desktop session, talking to the session D-Bus
  bus and the Wayland/X11 compositor to capture screenshots, and reading
  systemd-logind idle/lock state — none of which strict or devmode
  confinement can grant. Only install this on a machine you've dedicated
  to this purpose.
contact: https://github.com/kenvandine/automated-ken/issues
issues: https://github.com/kenvandine/automated-ken/issues
source-code: https://github.com/kenvandine/automated-ken
grade: stable
confinement: classic
license: GPL-3.0-or-later

apps:
  automated-ken-runner:
    # Invoke the snap's own bundled interpreter explicitly (bin/python3
    # -> usr/bin/python3.12) instead of relying on the console-script's
    # `#!/usr/bin/env python3` shebang, which under classic confinement
    # resolves to whatever python3 is on the *host's* PATH — a version
    # that may not match (and won't have the app's packages installed).
    # command-chain sets PYTHONHOME/PYTHONPATH so that interpreter can
    # find its own stdlib and the app's site-packages; see
    # local/command-chain/python-env.sh for why both are needed.
    command-chain: [command-chain/python-env.sh]
    command: bin/automated-ken-runner

  run:
    command-chain: [command-chain/python-env.sh]
    command: bin/automated-ken-runner run
    daemon: simple
    # Runs as a `systemctl --user` service under the same graphical
    # session it tests against — it needs the real session D-Bus bus,
    # WAYLAND_DISPLAY/DISPLAY, and XDG_RUNTIME_DIR to launch apps and
    # capture real screenshots; a system-scope (root) service would not
    # have any of that. Requires snapd >= 2.53.
    daemon-scope: user
    restart-condition: on-failure
    restart-delay: 10s

parts:
  automated-ken-runner:
    plugin: python
    source: .
    python-packages: [click, httpx, pillow]
    # This snap uses classic confinement, so unlike a strictly-confined
    # core24 snap it can't rely on the base snap providing a Python
    # interpreter at runtime — it must be staged into the payload itself
    # (see snapcraft's python_common.get_system_interpreter()).
    stage-packages: [python3.12-minimal, libpython3.12-minimal, libpython3.12-stdlib]
    # version: git doesn't work here for the same reason as the
    # automated-ken server snap: snapcraft.yaml lives in a subdirectory
    # of the top-level repo, which has no .git of its own. Append the
    # commit that was actually built instead, so a running runner's
    # revision can be traced back to an exact commit (`.git-commit` is
    # written by CI — see .github/workflows/build-runner.yml — into this
    # source dir before invoking snapcraft, since by the time this script
    # runs `source: .` has already been copied out of the full checkout).
    override-pull: |
      craftctl default
      version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
      version="${version:-0.0.0}"
      if [ -f .git-commit ]; then
        commit="$(cat .git-commit)"
        version="${version}+git${commit}"
      fi
      craftctl set version="${version}"

  command-chain:
    # Installs the PYTHONHOME/PYTHONPATH-setting wrapper referenced by
    # the apps' command-chain above (see that script for why it's
    # needed under classic confinement).
    plugin: dump
    source: snap/local/command-chain
    organize:
      python-env.sh: command-chain/python-env.sh
    stage:
      - command-chain/python-env.sh
