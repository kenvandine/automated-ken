[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-ken-runner"
version = "0.1.0"
description = "Remote YARF test runner agent for the Automated Ken snap-dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
automate-ken-runner = "automate_ken_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
